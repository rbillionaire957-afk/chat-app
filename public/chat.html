<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - pChat</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background: linear-gradient(135deg, #131eb0 0%, #79c3e8 100%);
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .nav-buttons {
            display: flex;
            gap: 15px;
        }

        .nav-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
        }

        .chat-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .users-sidebar {
            width: 300px;
            background: white;
            border-right: 1px solid #e0e0e0;
            display: flex;
            flex-direction: column;
        }

        .search-box {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
        }

        .search-box input {
            width: 100%;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
        }

        .users-list {
            flex: 1;
            overflow-y: auto;
        }

        .user-item {
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.3s;
            border-bottom: 1px solid #f0f0f0;
        }

        .user-item:hover, .user-item.active {
            background: #f0f0f0;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #131eb0 0%, #79c3e8 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
        }

        .user-info {
            flex: 1;
        }

        .user-name {
            font-weight: bold;
        }

        .user-status {
            font-size: 12px;
            color: #999;
        }

        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .chat-header {
            padding: 15px;
            border-bottom: 1px solid #e0e0e0;
            background: white;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }

        .message.sent {
            align-items: flex-end;
        }

        .message.received {
            align-items: flex-start;
        }

        .message-bubble {
            max-width: 70%;
            padding: 10px 15px;
            border-radius: 15px;
            position: relative;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #131eb0 0%, #79c3e8 100%);
            color: white;
        }

        .message.received .message-bubble {
            background: #f0f0f0;
            color: #333;
        }

        .message-time {
            font-size: 10px;
            margin-top: 5px;
            color: #999;
        }

        .message-actions {
            margin-top: 5px;
            display: flex;
            gap: 10px;
            font-size: 12px;
        }

        .message-actions button {
            background: none;
            border: none;
            cursor: pointer;
            color: #999;
        }

        .chat-input-area {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        .chat-input-area input {
            flex: 1;
            padding: 10px;
            border: 1px solid #e0e0e0;
            border-radius: 20px;
        }

        .chat-input-area button {
            padding: 10px 20px;
            background: #131eb0;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .file-input {
            display: none;
        }

        .typing-indicator {
            font-size: 12px;
            color: #999;
            padding: 5px 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="logo">pChat</div>
        <div class="nav-buttons">
            <button class="nav-btn" onclick="window.location.href='/dashboard'">📊 Dashboard</button>
            <button class="nav-btn" onclick="window.location.href='/call'">📞 Call</button>
            <button class="nav-btn" id="logout-btn">🚪 Logout</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="users-sidebar">
            <div class="search-box">
                <input type="text" id="search-users" placeholder="Search users...">
            </div>
            <div class="users-list" id="users-list"></div>
        </div>

        <div class="chat-area">
            <div class="chat-header" id="chat-header">
                <h3>Select a user to start chatting</h3>
            </div>
            <div class="chat-messages" id="chat-messages"></div>
            <div class="typing-indicator" id="typing-indicator" style="display: none;"></div>
            <div class="chat-input-area">
                <input type="text" id="message-input" placeholder="Type a message...">
                <button id="send-file">📎</button>
                <button id="send-message">Send</button>
                <input type="file" id="file-input" class="file-input">
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let currentUser = null;
        let currentChatUser = null;
        let typingTimeout = null;

        // Load users
        async function loadUsers() {
            const response = await fetch('/api/users');
            const users = await response.json();
            
            const usersList = document.getElementById('users-list');
            usersList.innerHTML = users.map(user => `
                <div class="user-item" onclick="selectUser('${user.id}', '${user.name}')">
                    <div class="user-avatar">${user.name.charAt(0)}</div>
                    <div class="user-info">
                        <div class="user-name">${user.name}</div>
                        <div class="user-status">${user.status || 'offline'}</div>
                    </div>
                </div>
            `).join('');
        }

        async function selectUser(userId, userName) {
            currentChatUser = { id: userId, name: userName };
            document.getElementById('chat-header').innerHTML = `<h3>Chat with ${userName}</h3>`;
            
            // Load messages
            const response = await fetch(`/api/messages/${userId}`);
            const messages = await response.json();
            displayMessages(messages);
        }

        function displayMessages(messages) {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML = messages.map(msg => `
                <div class="message ${msg.from === currentUser?.id ? 'sent' : 'received'}">
                    <div class="message-bubble">
                        ${msg.type === 'text' ? msg.message : 
                          `<a href="${msg.fileUrl}" target="_blank">📎 ${msg.message}</a>`}
                        ${msg.replyTo ? `<div style="font-size: 10px; opacity: 0.7;">Replying to: ${msg.replyTo.message}</div>` : ''}
                        ${msg.edited ? '<div style="font-size: 10px;">(edited)</div>' : ''}
                    </div>
                    <div class="message-time">${new Date(msg.timestamp).toLocaleTimeString()}</div>
                    <div class="message-actions">
                        <button onclick="reactToMessage('${msg.id}', '👍')">👍</button>
                        <button onclick="reactToMessage('${msg.id}', '❤️')">❤️</button>
                        <button onclick="editMessage('${msg.id}')">Edit</button>
                        <button onclick="deleteMessage('${msg.id}')">Delete</button>
                        <button onclick="replyToMessage('${msg.id}', '${msg.message}')">Reply</button>
                    </div>
                    ${msg.reactions?.length ? `<div style="font-size: 10px; margin-top: 5px;">${msg.reactions.map(r => r.reaction).join(' ')}</div>` : ''}
                </div>
            `).join('');
            
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('message-input');
            const message = input.value.trim();
            
            if (message && currentChatUser) {
                const newMessage = {
                    from: currentUser.id,
                    to: currentChatUser.id,
                    message: message,
                    type: 'text'
                };
                
                const response = await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newMessage)
                });
                
                input.value = '';
                loadMessages();
            }
        }

        async function loadMessages() {
            if (currentChatUser) {
                const response = await fetch(`/api/messages/${currentChatUser.id}`);
                const messages = await response.json();
                displayMessages(messages);
            }
        }

        document.getElementById('send-message').onclick = sendMessage;
        document.getElementById('message-input').onkeypress = (e) => {
            if (e.key === 'Enter') sendMessage();
            
            if (currentChatUser) {
                socket.emit('typing', { from: currentUser.id, to: currentChatUser.id });
                clearTimeout(typingTimeout);
                typingTimeout = setTimeout(() => {
                    socket.emit('stop-typing', { from: currentUser.id, to: currentChatUser.id });
                }, 1000);
            }
        };

        document.getElementById('send-file').onclick = () => {
            document.getElementById('file-input').click();
        };

        document.getElementById('file-input').onchange = async (e) => {
            const file = e.target.files[0];
            const formData = new FormData();
            formData.append('file', file);
            formData.append('type', 'files');
            
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            if (data.success && currentChatUser) {
                await fetch('/api/messages', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        from: currentUser.id,
                        to: currentChatUser.id,
                        message: file.name,
                        type: 'file',
                        fileUrl: data.fileUrl
                    })
                });
                loadMessages();
            }
        };

        // Socket events
        socket.on('new-message', (message) => {
            if (currentChatUser && (message.from === currentChatUser.id || message.to === currentChatUser.id)) {
                loadMessages();
            }
        });

        socket.on('user-typing', ({ from }) => {
            if (from === currentChatUser?.id) {
                const indicator = document.getElementById('typing-indicator');
                indicator.textContent = `${currentChatUser.name} is typing...`;
                indicator.style.display = 'block';
                setTimeout(() => {
                    indicator.style.display = 'none';
                }, 2000);
            }
        });

        socket.on('message-updated', () => {
            loadMessages();
        });

        socket.on('message-deleted', () => {
            loadMessages();
        });

        // Get current user
        async function init() {
            const response = await fetch('/api/users');
            const users = await response.json();
            if (users.length > 0) {
                currentUser = users[0];
                socket.emit('user-online', currentUser.id);
                loadUsers();
            }
        }

        document.getElementById('logout-btn').onclick = async () => {
            await fetch('/api/logout', { method: 'POST' });
            window.location.href = '/';
        };

        init();
    </script>
</body>
</html>
