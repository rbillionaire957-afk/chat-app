<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Video Conference - Chat, Voice & Video Calls</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div class="container">
        <div class="main-content">
            <!-- Join Screen -->
            <div id="join-screen" class="screen active">
                <div class="join-container">
                    <h1>Video Conference</h1>
                    <div class="join-options">
                        <div class="join-card">
                            <h2>Create Meeting</h2>
                            <input type="text" id="create-name" placeholder="Your Name" class="input-field">
                            <button id="create-room" class="btn-primary">Create New Room</button>
                        </div>
                        <div class="join-card">
                            <h2>Join Meeting</h2>
                            <input type="text" id="room-id" placeholder="Room ID" class="input-field">
                            <input type="text" id="join-name" placeholder="Your Name" class="input-field">
                            <button id="join-room" class="btn-primary">Join Room</button>
                        </div>
                    </div>
                    <div id="error-message" class="error-message"></div>
                </div>
            </div>

            <!-- Meeting Screen -->
            <div id="meeting-screen" class="screen">
                <div class="meeting-header">
                    <div class="room-info">
                        <span id="room-id-display"></span>
                        <span id="user-count">0 participants</span>
                    </div>
                    <button id="leave-room" class="btn-danger">Leave Room</button>
                </div>

                <div class="meeting-body">
                    <div class="video-grid" id="video-grid">
                        <!-- Dynamic video containers -->
                    </div>
                    
                    <div class="chat-sidebar" id="chat-sidebar">
                        <div class="chat-header">
                            <h3>Chat</h3>
                            <button id="toggle-chat" class="icon-btn">▶</button>
                        </div>
                        <div class="chat-messages" id="chat-messages"></div>
                        <div class="chat-input">
                            <input type="text" id="chat-input" placeholder="Type a message...">
                            <button id="send-message" class="btn-secondary">Send</button>
                        </div>
                    </div>
                </div>

                <div class="meeting-controls">
                    <button id="toggle-audio" class="control-btn audio-on">
                        <span class="icon">🎤</span>
                        <span>Mute</span>
                    </button>
                    <button id="toggle-video" class="control-btn video-on">
                        <span class="icon">📹</span>
                        <span>Stop Video</span>
                    </button>
                    <button id="screen-share" class="control-btn">
                        <span class="icon">🖥️</span>
                        <span>Share Screen</span>
                    </button>
                    <button id="file-share" class="control-btn">
                        <span class="icon">📎</span>
                        <span>Share File</span>
                    </button>
                    <input type="file" id="file-input" style="display: none;">
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/client.js"></script>
</body>
</html>
