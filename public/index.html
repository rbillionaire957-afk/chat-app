<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pChat | Connect with Cosmic Identity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #010103;
            color: #ffffff;
        }

        #webgl-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .ui-container {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .auth-card {
            background: rgba(19, 30, 176, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            pointer-events: auto;
            border: 1px solid rgba(121, 195, 232, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 2rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #fff 0%, #79c3e8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 5px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: #131eb0;
            color: #79c3e8;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(121, 195, 232, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #79c3e8;
            background: rgba(255, 255, 255, 0.15);
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #131eb0 0%, #79c3e8 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }

        .otp-section {
            display: none;
        }

        .otp-section.active {
            display: block;
        }

        .error-message {
            background: rgba(244, 67, 54, 0.9);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .success-message {
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 10px;
            border-radius: 8px;
            margin-top: 15px;
            text-align: center;
            font-size: 0.9rem;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <canvas id="webgl-canvas"></canvas>
    
    <div class="ui-container">
        <div class="auth-card">
            <div class="logo">pChat</div>
            
            <div class="tab-buttons">
                <button class="tab-btn active" onclick="switchTab('login')">Login</button>
                <button class="tab-btn" onclick="switchTab('signup')">Sign Up</button>
            </div>
            
            <!-- Login Form -->
            <div id="login-form">
                <div class="form-group">
                    <input type="tel" id="login-phone" placeholder="Phone Number (e.g., 255712345678)">
                </div>
                <div class="form-group">
                    <input type="password" id="login-password" placeholder="Password">
                </div>
                <button class="btn" onclick="login()">Login</button>
            </div>
            
            <!-- Signup Form -->
            <div id="signup-form" style="display: none;">
                <div class="form-group">
                    <input type="text" id="signup-name" placeholder="Username">
                </div>
                <div class="form-group">
                    <input type="tel" id="signup-phone" placeholder="Phone Number (e.g., 255712345678)">
                </div>
                <div class="form-group">
                    <input type="password" id="signup-password" placeholder="Password">
                </div>
                <div class="form-group">
                    <input type="password" id="signup-confirm" placeholder="Confirm Password">
                </div>
                
                <div id="signup-otp-section" class="otp-section">
                    <div class="form-group">
                        <input type="text" id="signup-otp" placeholder="Enter OTP Code">
                    </div>
                    <button class="btn btn-secondary" id="resend-otp-btn" onclick="resendOTP()" style="display: none;">Resend OTP</button>
                </div>
                
                <button class="btn" id="signup-btn" onclick="sendOTP()">Send OTP</button>
                <button class="btn" id="verify-btn" onclick="verifyOTP()" style="display: none;">Verify & Sign Up</button>
            </div>
            
            <div id="message"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // WebGL Background (same as provided)
        const canvas = document.querySelector('#webgl-canvas');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.z = 5.2;
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const mouse = new THREE.Vector3(0, 0, 0);
        const targetMouse = new THREE.Vector3(0, 0, 0);
        const raycaster = new THREE.Raycaster();
        const planeZ = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);

        window.addEventListener('mousemove', (e) => {
            const ndcX = (e.clientX / window.innerWidth) * 2 - 1;
            const ndcY = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(new THREE.Vector2(ndcX, ndcY), camera);
            raycaster.ray.intersectPlane(planeZ, targetMouse);
        });

        const planetarySystem = new THREE.Group();
        planetarySystem.position.set(1.4, 0, 0);
        planetarySystem.rotation.set(0.35, -0.3, -0.15);
        scene.add(planetarySystem);

        const starCount = 2000;
        const starPositions = new Float32Array(starCount * 3);
        for(let i=0; i<starCount; i++) {
            starPositions[i*3] = (Math.random() - 0.5) * 18;
            starPositions[i*3+1] = (Math.random() - 0.5) * 14;
            starPositions[i*3+2] = -Math.random() * 5 - 2;
        }
        const starGeometry = new THREE.BufferGeometry();
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ size: 0.02, color: 0xffffff, transparent: true, opacity: 0.5, blending: THREE.AdditiveBlending });
        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        const planetParticleCount = 30000;
        const planetPositions = new Float32Array(planetParticleCount * 3);
        for(let i=0; i<planetParticleCount; i++) {
            const u = Math.random();
            const v = Math.random();
            const theta = u * 2.0 * Math.PI;
            const phi = Math.acos(2.0 * v - 1.0);
            const radius = 0.95 + (Math.random() * 0.02);
            planetPositions[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            planetPositions[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            planetPositions[i*3+2] = radius * Math.cos(phi);
        }
        const planetGeometry = new THREE.BufferGeometry();
        planetGeometry.setAttribute('position', new THREE.BufferAttribute(planetPositions, 3));
        const planetShaderMaterial = new THREE.ShaderMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            uniforms: { uTime: { value: 0 }, uMouse: { value: new THREE.Vector3(0,0,0) } },
            vertexShader: `
                uniform float uTime;
                uniform vec3 uMouse;
                varying float vYPosition;
                varying float vCursorDist;
                void main() {
                    vYPosition = position.y;
                    vec3 pos = position;
                    vec4 worldPos = modelMatrix * vec4(pos, 1.0);
                    float dist = distance(worldPos.xyz, uMouse);
                    vCursorDist = dist;
                    if(dist < 1.4) {
                        float force = (1.4 - dist) * 0.18;
                        pos.x += sin(pos.y * 5.0 + uTime) * force * 0.4;
                        pos.z += cos(pos.x * 5.0 + uTime) * force * 0.4;
                    }
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = (11.0 / -mvPosition.z);
                }
            `,
            fragmentShader: `
                varying float vYPosition;
                varying float vCursorDist;
                void main() {
                    if(distance(gl_PointCoord, vec2(0.5)) > 0.5) discard;
                    float bandPattern = sin(vYPosition * 16.0);
                    vec3 baseBeige = vec3(0.92, 0.78, 0.58);
                    vec3 darkBandColor = vec3(0.52, 0.36, 0.22);
                    vec3 finalColor = mix(baseBeige, darkBandColor, smoothstep(-0.4, 0.4, bandPattern));
                    if(vCursorDist < 1.4) {
                        float glowFactor = (1.4 - vCursorDist) * 0.5;
                        finalColor = mix(finalColor, vec3(0.0, 1.0, 0.85), glowFactor);
                    }
                    gl_FragColor = vec4(finalColor, 0.8);
                }
            `
        });
        const planetBody = new THREE.Points(planetGeometry, planetShaderMaterial);
        planetarySystem.add(planetBody);

        const ringParticleCount = 50000;
        const ringPositions = new Float32Array(ringParticleCount * 3);
        const ringDistances = new Float32Array(ringParticleCount);
        const ringAngles = new Float32Array(ringParticleCount);
        for(let i=0; i<ringParticleCount; i++) {
            const innerRadius = 1.35;
            const outerRadius = 2.65;
            let randRadius = Math.random();
            if((randRadius > 0.35 && randRadius < 0.42) || (randRadius > 0.75 && randRadius < 0.79)) {
                randRadius += 0.09;
            }
            const currentRadius = innerRadius + (randRadius * (outerRadius - innerRadius));
            const angle = Math.random() * Math.PI * 2;
            ringPositions[i*3] = Math.cos(angle) * currentRadius;
            ringPositions[i*3+1] = (Math.random() - 0.5) * 0.015;
            ringPositions[i*3+2] = Math.sin(angle) * currentRadius;
            ringDistances[i] = currentRadius;
            ringAngles[i] = angle;
        }
        const ringGeometry = new THREE.BufferGeometry();
        ringGeometry.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
        ringGeometry.setAttribute('aRadius', new THREE.BufferAttribute(ringDistances, 1));
        ringGeometry.setAttribute('aAngle', new THREE.BufferAttribute(ringAngles, 1));
        const ringShaderMaterial = new THREE.ShaderMaterial({
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            uniforms: { uTime: { value: 0 }, uMouse: { value: new THREE.Vector3(0,0,0) } },
            vertexShader: `
                uniform float uTime;
                uniform vec3 uMouse;
                attribute float aRadius;
                attribute float aAngle;
                varying float vRadius;
                varying float vDisruption;
                void main() {
                    vRadius = aRadius;
                    vec3 pos = position;
                    float individualOrbitSpeed = uTime * (1.8 / aRadius) * 0.15;
                    float currentAngle = aAngle + individualOrbitSpeed;
                    pos.x = cos(currentAngle) * aRadius;
                    pos.z = sin(currentAngle) * aRadius;
                    vec4 worldPos = modelMatrix * vec4(pos, 1.0);
                    float dist = distance(worldPos.xyz, uMouse);
                    vDisruption = 0.0;
                    if(dist < 1.2) {
                        float pushForce = (1.2 - dist);
                        pos.y += sin(aRadius * 20.0 + uTime * 5.0) * pushForce * 0.18;
                        pos.xz += (worldPos.xz - uMouse.xz) * pushForce * 0.15;
                        vDisruption = pushForce;
                    }
                    vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
                    gl_Position = projectionMatrix * mvPosition;
                    gl_PointSize = (7.5 / -mvPosition.z) * (1.0 + vDisruption * 0.8);
                }
            `,
            fragmentShader: `
                varying float vRadius;
                varying float vDisruption;
                void main() {
                    if(distance(gl_PointCoord, vec2(0.5)) > 0.5) discard;
                    float ringTextureMap = sin(vRadius * 60.0);
                    vec3 goldenDustColor = vec3(0.88, 0.72, 0.52);
                    vec3 icySilverColor = vec3(0.6, 0.72, 0.85);
                    vec3 color = mix(goldenDustColor, icySilverColor, smoothstep(-0.5, 0.5, ringTextureMap));
                    if(vDisruption > 0.0) {
                        color = mix(color, vec3(1.0, 1.0, 1.0), vDisruption * 0.9);
                    }
                    float edgeFade = smoothstep(1.35, 1.45, vRadius) * (1.0 - smoothstep(2.5, 2.65, vRadius));
                    gl_FragColor = vec4(color, edgeFade * 0.55);
                }
            `
        });
        const ringSystem = new THREE.Points(ringGeometry, ringShaderMaterial);
        planetarySystem.add(ringSystem);

        const clock = new THREE.Clock();
        const tick = () => {
            const elapsed = clock.getElapsedTime();
            mouse.x += (targetMouse.x - mouse.x) * 0.12;
            mouse.y += (targetMouse.y - mouse.y) * 0.12;
            mouse.z += (targetMouse.z - mouse.z) * 0.12;
            planetShaderMaterial.uniforms.uTime.value = elapsed;
            planetShaderMaterial.uniforms.uMouse.value.copy(mouse);
            ringShaderMaterial.uniforms.uTime.value = elapsed;
            ringShaderMaterial.uniforms.uMouse.value.copy(mouse);
            planetBody.rotation.y = elapsed * 0.08;
            planetarySystem.rotation.y = -0.3 + (mouse.x * 0.18);
            planetarySystem.rotation.x = 0.35 + (mouse.y * 0.12);
            starMaterial.opacity = 0.35 + Math.sin(elapsed * 3.5) * 0.15;
            renderer.render(scene, camera);
            window.requestAnimationFrame(tick);
        };
        tick();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Authentication Logic
        let currentPhone = '';
        let currentOTP = '';

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabs = document.querySelectorAll('.tab-btn');
            
            tabs.forEach(btn => btn.classList.remove('active'));
            
            if (tab === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';
                tabs[0].classList.add('active');
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';
                tabs[1].classList.add('active');
                resetSignup();
            }
        }

        function resetSignup() {
            document.getElementById('signup-otp-section').classList.remove('active');
            document.getElementById('signup-btn').style.display = 'block';
            document.getElementById('verify-btn').style.display = 'none';
            document.getElementById('resend-otp-btn').style.display = 'none';
        }

        async function sendOTP() {
            const username = document.getElementById('signup-name').value;
            const phone = document.getElementById('signup-phone').value;
            const password = document.getElementById('signup-password').value;
            const confirm = document.getElementById('signup-confirm').value;
            
            if (!username || !phone || !password) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            
            if (password !== confirm) {
                showMessage('Passwords do not match', 'error');
                return;
            }
            
            currentPhone = phone;
            
            showMessage('Sending OTP...', 'success');
            
            try {
                const response = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('OTP sent successfully! Check your WhatsApp', 'success');
                    document.getElementById('signup-otp-section').classList.add('active');
                    document.getElementById('signup-btn').style.display = 'none';
                    document.getElementById('verify-btn').style.display = 'block';
                    document.getElementById('resend-otp-btn').style.display = 'block';
                } else {
                    showMessage(data.error || 'Failed to send OTP', 'error');
                }
            } catch (error) {
                showMessage('Error sending OTP', 'error');
            }
        }
        
        async function resendOTP() {
            await sendOTP();
        }
        
        async function verifyOTP() {
            const otp = document.getElementById('signup-otp').value;
            const username = document.getElementById('signup-name').value;
            const password = document.getElementById('signup-password').value;
            
            if (!otp) {
                showMessage('Please enter OTP', 'error');
                return;
            }
            
            showMessage('Verifying...', 'success');
            
            try {
                const response = await fetch('/api/verify-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        phoneNumber: currentPhone,
                        code: otp,
                        username: username,
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('Login successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/dashboard.html';
                    }, 1000);
                } else {
                    showMessage(data.error || 'Verification failed', 'error');
                }
            } catch (error) {
                showMessage('Error verifying OTP', 'error');
            }
        }
        
        async function login() {
            const phone = document.getElementById('login-phone').value;
            const password = document.getElementById('login-password').value;
            
            if (!phone || !password) {
                showMessage('Please fill all fields', 'error');
                return;
            }
            
            // For existing users, we need to verify via OTP first
            showMessage('Sending verification code...', 'success');
            
            try {
                const response = await fetch('/api/send-otp', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phoneNumber: phone })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentPhone = phone;
                    const otpCode = prompt('Enter OTP sent to your WhatsApp:');
                    if (otpCode) {
                        const verifyResponse = await fetch('/api/verify-otp', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                phoneNumber: phone,
                                code: otpCode,
                                username: '',
                                password: password
                            })
                        });
                        
                        const verifyData = await verifyResponse.json();
                        
                        if (verifyResponse.ok) {
                            showMessage('Login successful! Redirecting...', 'success');
                            setTimeout(() => {
                                window.location.href = '/dashboard.html';
                            }, 1000);
                        } else {
                            showMessage(verifyData.error || 'Login failed', 'error');
                        }
                    }
                } else {
                    showMessage(data.error || 'Failed to send OTP', 'error');
                }
            } catch (error) {
                showMessage('Error during login', 'error');
            }
        }
        
        function showMessage(msg, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.innerHTML = `<div class="${type === 'error' ? 'error-message' : 'success-message'}">${msg}</div>`;
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }
    </script>
</body>
</html>
