<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>pChat Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #131eb0 0%, #79c3e8 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .call-container {
            background: rgba(0,0,0,0.8);
            width: 100%;
            height: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        .video-container {
            flex: 1;
            display: flex;
            position: relative;
            background: #000;
        }

        .remote-video {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #1a1a1a;
        }

        .remote-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .local-video {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 200px;
            height: 150px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #79c3e8;
            z-index: 10;
        }

        .local-video video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .controls {
            padding: 20px;
            background: rgba(0,0,0,0.9);
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .control-btn {
            padding: 15px 25px;
            background: #333;
            border: none;
            border-radius: 50px;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }

        .control-btn:hover {
            transform: scale(1.05);
        }

        .control-btn.active {
            background: #4caf50;
        }

        .control-btn.danger {
            background: #f44336;
        }

        .call-info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            padding: 10px 20px;
            border-radius: 20px;
            color: white;
            z-index: 10;
        }

        .call-timer {
            font-size: 1.2rem;
            font-weight: bold;
        }

        @media (max-width: 768px) {
            .local-video {
                width: 100px;
                height: 75px;
                bottom: 80px;
            }
            
            .control-btn {
                padding: 10px 15px;
                font-size: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="call-container">
        <div class="video-container">
            <div class="remote-video" id="remote-video">
                <video id="remote-video-element" autoplay playsinline></video>
            </div>
            <div class="local-video" id="local-video">
                <video id="local-video-element" autoplay playsinline muted></video>
            </div>
        </div>
        
        <div class="call-info">
            <div id="call-status">Connecting...</div>
            <div class="call-timer" id="call-timer">00:00</div>
        </div>
        
        <div class="controls">
            <button class="control-btn" id="toggle-mic">
                🎤 Mute
            </button>
            <button class="control-btn" id="toggle-video">
                📹 Stop Video
            </button>
            <button class="control-btn danger" id="end-call">
                📞 End Call
            </button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/call.js"></script>
</body>
</html>
